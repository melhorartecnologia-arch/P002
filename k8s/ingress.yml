apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dora-ingress
  namespace: dora
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  rules:
    - host: dora.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: dora-api
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dora-web
                port:
                  number: 3000
  tls:
    - hosts:
        - dora.example.com
      secretName: dora-tls
