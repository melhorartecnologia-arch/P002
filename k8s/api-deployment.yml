apiVersion: apps/v1
kind: Deployment
metadata:
  name: dora-api
  namespace: dora
  labels:
    app: dora
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dora
      component: api
  template:
    metadata:
      labels:
        app: dora
        component: api
    spec:
      containers:
        - name: api
          image: registry.local/dora/api:latest
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: dora-secrets
            - configMapRef:
                name: dora-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: dora-api
  namespace: dora
spec:
  selector:
    app: dora
    component: api
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
