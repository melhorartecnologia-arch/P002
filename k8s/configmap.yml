apiVersion: v1
kind: ConfigMap
metadata:
  name: dora-config
  namespace: dora
data:
  NODE_ENV: "production"
  API_PORT: "3001"
  API_HOST: "0.0.0.0"
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  REDIS_URL: "redis://redis:6379"
  QDRANT_URL: "http://qdrant:6333"
  MINIO_ENDPOINT: "minio"
  MINIO_PORT: "9000"
  MINIO_BUCKET: "dora-documents"
  MINIO_USE_SSL: "false"
  LOG_LEVEL: "info"
  CLAUDE_MAX_CONCURRENT_REQUESTS: "50"
  CLAUDE_BATCH_ENABLED: "true"
  CLAUDE_MODEL_VISION: "claude-sonnet-4-20250514"
  CLAUDE_MODEL_EXTRACTION: "claude-sonnet-4-20250514"
  CLAUDE_MODEL_CLASSIFICATION: "claude-haiku-4-5-20251001"
  CLAUDE_MODEL_ANALYSIS: "claude-opus-4-6"
  NEXT_PUBLIC_API_URL: "https://dora.example.com/api"
  NEXT_PUBLIC_APP_URL: "https://dora.example.com"
